<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c2228">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Setup Auto</title>
<style>
:root{--bg:#eceeef;--card:#fff;--ink:#1c2228;--mut:#5d6872;--line:#d5d9dc;--red:#d62b2b;--hd:#1c2228}
@media(prefers-color-scheme:dark){:root{--bg:#14181c;--card:#1f252b;--ink:#eceeef;--mut:#9aa5ae;--line:#323a42;--red:#ff5a4f;--hd:#0d1013}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--hd);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 19px;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:repeating-linear-gradient(90deg,var(--red) 0 22px,#fff 22px 44px)}
h1{font-size:21px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;font-size:26px;line-height:1;padding:4px 8px;cursor:pointer}
#bk{padding-left:0}
main{max-width:640px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:10px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;width:100%;cursor:pointer}
.row small{color:var(--mut);text-align:right}
.emp{color:var(--mut);text-align:center;margin:24px 0}
.err{background:var(--card);border:1px solid var(--red);border-radius:10px;padding:14px}
input[type=search]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 14px 8px}
h2{font-size:17px;margin:12px 0 4px}
.kv{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--line)}
h2+.kv{border-top:0}
.kv span{color:var(--mut)}
.kv b{text-align:right;font-variant-numeric:tabular-nums}
.txt{white-space:pre-wrap;margin:6px 0 4px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><button id="bk" data-a="back" aria-label="Indietro" hidden>‹</button><h1 id="t">Setup Auto</h1><button data-a="ref" aria-label="Aggiorna">↻</button></header>
<main id="m"></main>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=k=>{k=String(k).replace(/_/g,' ');return k.charAt(0).toUpperCase()+k.slice(1)};
const fmt=v=>v===true?'Sì':v===false?'No':(v===null||v==='')?'—':esc(v);
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
let DB=null,err='',view={n:'list'},q='';

async function load(){
 try{
  const r=await fetch('impostazioni.json',{cache:'no-store'});
  if(!r.ok)throw new Error('Il file impostazioni.json non è stato trovato nel repository.');
  const d=await r.json();
  if(!d||!Array.isArray(d.auto))throw new Error('Nel file manca l’elenco "auto".');
  DB=d;err='';
 }catch(e){
  err=e instanceof SyntaxError?'Il file impostazioni.json contiene un errore di scrittura: controlla virgole, virgolette e parentesi.':e.message;
 }
}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),2200)}

function listHTML(){
 const cs=DB.auto.map((c,i)=>({c,i})).filter(o=>String(o.c.nome).toLowerCase().includes(q.toLowerCase()));
 if(!cs.length)return`<p class="emp">${DB.auto.length?'Nessuna auto trovata.':'Il file non contiene ancora nessuna auto.'}</p>`;
 return cs.map(o=>`<button class="row" data-a="car" data-i="${o.i}"><b>${esc(o.c.nome)}</b><small>${(o.c.modalita||[]).length} modalità</small></button>`).join('');
}
function preview(m){
 const s=Object.entries(m).find(([k,v])=>isObj(v));
 if(!s)return'';
 return Object.values(s[1]).slice(0,2).filter(v=>!isObj(v)).map(fmt).join(', ');
}
function render(v){
 view=v;const h=$('#t'),m=$('#m');
 if(!DB){h.textContent='Setup Auto';$('#bk').hidden=true;m.innerHTML=`<div class="err"><b>Impossibile leggere le impostazioni</b><p>${esc(err||'Caricamento…')}</p><p>Tocca ↻ per riprovare.</p></div>`;return}
 const c=DB.auto[v.c],x=c&&(c.modalita||[])[v.m];
 if(v.n==='car'&&!c||v.n==='mode'&&!x)view=v={n:'list'};
 $('#bk').hidden=v.n==='list';
 if(v.n==='list'){
  h.textContent='Setup Auto';
  m.innerHTML=`<input id="q" type="search" placeholder="Cerca auto" value="${esc(q)}"><div id="lst" style="display:flex;flex-direction:column;gap:10px">${listHTML()}</div>`;
 }else if(v.n==='car'){
  h.textContent=c.nome;
  const ms=c.modalita||[];
  m.innerHTML=ms.length?ms.map((y,i)=>`<button class="row" data-a="mode" data-i="${i}"><b>${esc(y.nome)}</b><small>${esc(preview(y))}</small></button>`).join(''):'<p class="emp">Nessuna modalità per questa auto.</p>';
 }else{
  h.textContent=c.nome+', '+x.nome;
  const rest=[];let out='';
  for(const [k,val] of Object.entries(x)){
   if(k==='nome')continue;
   if(isObj(val))out+=`<section><h2>${esc(pretty(k))}</h2>${Object.entries(val).map(([a,b])=>`<div class="kv"><span>${esc(pretty(a))}</span><b>${fmt(isObj(b)?JSON.stringify(b):b)}</b></div>`).join('')}</section>`;
   else rest.push([k,val]);
  }
  if(rest.length)out+=`<section><h2>Altro</h2>${rest.map(([k,val])=>String(val).length>40?`<div class="kv" style="flex-direction:column;gap:2px"><span>${esc(pretty(k))}</span><div class="txt">${fmt(val)}</div></div>`:`<div class="kv"><span>${esc(pretty(k))}</span><b>${fmt(val)}</b></div>`).join('')}</section>`;
  m.innerHTML=out||'<p class="emp">Nessuna impostazione per questa modalità.</p>';
 }
 scrollTo(0,0);
}
function go(v){history.pushState(v,'');render(v)}
addEventListener('popstate',e=>render(e.state||{n:'list'}));

document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a;
 if(a==='back')history.back();
 else if(a==='car')go({n:'car',c:+b.dataset.i});
 else if(a==='mode')go({n:'mode',c:view.c,m:+b.dataset.i});
 else if(a==='ref'){const had=DB;await load();if(err&&had)toast('Aggiornamento non riuscito');else if(!err)toast('Impostazioni aggiornate');render(view)}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#lst').innerHTML=listHTML()}});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
load().then(()=>render({n:'list'}));
</script>
</body>
</html>
